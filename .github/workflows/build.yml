name: build

# Builds release binaries for Linux and Windows. Every run uploads the binaries
# as workflow artifacts; a tag named v* also publishes them as a GitHub release.

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: think
            package: think-linux-x86_64.tar.gz
          - name: windows-x86_64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            binary: think.exe
            package: think-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Install system dependencies
        if: matrix.name == 'linux-x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev libgtk-3-0 adwaita-icon-theme \
            libxkbcommon-x11-0 libgl1-mesa-dri libglx-mesa0 xvfb xauth xdotool

      - name: Run tests
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Test Linux desktop app
        if: matrix.name == 'linux-x86_64'
        run: xvfb-run -a -s '-screen 0 1280x900x24' bash tests/linux-desktop.sh target/${{ matrix.target }}/release/${{ matrix.binary }}

      - name: Test MCP with the Linux desktop app
        if: matrix.name == 'linux-x86_64'
        run: xvfb-run -a -s '-screen 0 1280x900x24' python3 tests/mcp-http.py target/${{ matrix.target }}/release/${{ matrix.binary }}

      - name: Package
        shell: bash
        env:
          BINARY: ${{ matrix.binary }}
          PACKAGE: ${{ matrix.package }}
          ARTIFACT_DIR: ${{ github.workspace }}/dist
        run: |
          source_dir="${{ github.workspace }}/target/${{ matrix.target }}/release"
          mkdir -p "$ARTIFACT_DIR"
          if [ "${{ matrix.name }}" = "linux-x86_64" ]; then
            tar -C "$source_dir" -czf "$ARTIFACT_DIR/$PACKAGE" "$BINARY"
          else
            cp "$source_dir/$BINARY" "$ARTIFACT_DIR/$PACKAGE"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: windows-x86_64
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Think $GITHUB_REF_NAME" \
            --generate-notes \
            dist/*
