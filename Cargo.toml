[package]
name = "think"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A private, automatically synced plain-text notebook."

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["svg"] }
git2 = { version = "0.19", features = ["https", "vendored-openssl"] }
dirs = "5.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
rmcp = { version = "3.9.0", features = ["transport-io"] }
tokio = { version = "1.54.1", features = ["full"] }
schemars = "1.2.3"
keyring = { version = "4.2.0", features = ["v1"] }

[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle = "0.6"
x11rb = { version = "0.13", features = ["shape"] }

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winres = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
tempfile = "3.27.0"
